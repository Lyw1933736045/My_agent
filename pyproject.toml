[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-single-agent"
version = "0.1.0"
description = "A standalone financial policy and market research agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.3.0",
  "tavily-python>=0.3.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "loguru>=0.7.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "json-repair>=0.58.6",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "markdown-it-py>=3.0.0",
]

[project.scripts]
financial-single-agent = "financial_single_agent.cli:main"
financial-single-agent-api = "financial_single_agent.api:main"

[tool.setuptools]
packages = [
  "financial_single_agent",
  "financial_single_agent.llms",
  "financial_single_agent.nodes",
  "financial_single_agent.prompts",
  "financial_single_agent.state",
  "financial_single_agent.tools",
  "financial_single_agent.utils",
]
package-dir = {financial_single_agent = "."}

[tool.setuptools.package-data]
financial_single_agent = ["config/*.yaml", "web/*"]
