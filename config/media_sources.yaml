version: 1

# NewsNow 提供各平台当前热榜；查询词会在本地匹配标题。
newsnow:
  enabled: true
  api_url: "https://newsnow.busiyi.world/api/s"
  timeout_seconds: 30
  max_retries: 1
  retry_wait_min_seconds: 2
  retry_wait_max_seconds: 3
  request_interval_seconds: 0.5

  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-hot"
      name: "财联社"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
      source_group: "news_media"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
      source_group: "news_media"

    - id: "tencent-hot"
      name: "腾讯新闻"
      expected_domain: "qq.com"
      source_group: "news_media"
      
    - id: "wallstreetcn-quick"
      name: "华尔街见闻快讯"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-telegraph"
      name: "财联社电报"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "jin10"
      name: "金十数据"
      expected_domain: "jin10.com"
      source_group: "news_media"

    - id: "gelonghui"
      name: "格隆汇"
      expected_domain: "gelonghui.com"
      source_group: "news_media"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
      source_group: "social_media"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
      source_group: "social_media"

    - id: "bilibili-hot-search"
      name: "B站热搜"
      expected_domain: "bilibili.com"
      source_group: "social_media"

# RSS 用于补充不一定进入热榜的最新媒体文章。
rss:
  enabled: true
  timeout_seconds: 25
  max_content_bytes: 6000000
  max_age_days: 30
  default_max_items: 0
  request_interval_min_seconds: 0.5
  request_interval_max_seconds: 1.0
  max_retries: 1
  retry_wait_min_seconds: 2
  retry_wait_max_seconds: 3
  # 每个 feed 可选配置 max_items 和 max_age_days；0 表示不限制。
  feeds:
    # =========================
    # 官方及权威媒体
    # =========================
    - id: "cctv-xwlb"
      name: "央视新闻-新闻联播"
      url: "${RSSHUB_BASE}/cctv/xwlb"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "people-finance"
      name: "人民网-财经"
      url: "${RSSHUB_BASE}/people/finance"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "inewsweek-finance"
      name: "中国新闻周刊-经济"
      url: "${RSSHUB_BASE}/inewsweek/finance"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "chinanews-latest"
      name: "中国新闻网-最新"
      url: "${RSSHUB_BASE}/chinanews"
      layer: "media"
      source_group: "official_media"
      enabled: true

    # =========================
    # 内地财经媒体
    # =========================
    - id: "wallstreetcn-live"
      name: "华尔街见闻-实时快讯"
      url: "${RSSHUB_BASE}/wallstreetcn/live"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "wallstreetcn-hot"
      name: "华尔街见闻-热门文章"
      url: "${RSSHUB_BASE}/wallstreetcn/hot"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "wallstreetcn-news"
      name: "华尔街见闻-新闻"
      url: "${RSSHUB_BASE}/wallstreetcn/news"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-live"
      name: "格隆汇-实时快讯"
      url: "${RSSHUB_BASE}/gelonghui/live"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-home"
      name: "格隆汇-首页"
      url: "${RSSHUB_BASE}/gelonghui/home"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-hot"
      name: "格隆汇-热门文章"
      url: "${RSSHUB_BASE}/gelonghui/hot-article"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "yicai-latest"
      name: "第一财经-最新"
      url: "${RSSHUB_BASE}/yicai/latest"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "yicai-headline"
      name: "第一财经-头条"
      url: "${RSSHUB_BASE}/yicai/headline"
      layer: "media"
      source_group: "news_media"
      enabled: true

    # =========================
    # 社交平台
    # =========================
    - id: "zhihu-hot"
      name: "知乎-热榜"
      url: "${RSSHUB_BASE}/zhihu/hot"
      layer: "media"
      source_group: "social_media"
      enabled: true

    # =========================
    # 动态关键词路由（默认关闭）
    # =========================
    - id: "gelonghui-keyword"
      name: "格隆汇-关键词"
      url_template: "${RSSHUB_BASE}/gelonghui/keyword/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false

    - id: "eastmoney-search"
      name: "东方财富-关键词搜索"
      url_template: "${RSSHUB_BASE}/eastmoney/search/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false

# Tavily 在 NewsNow、RSS 完成后执行，只用于发现 URL；简报仍重新抓取正文。
tavily:
  enabled: true
  max_results_per_query: 5
  search_depth: "basic"
  # days: 7

# 微博桌面搜索；Cookie 只通过项目外部文件提供，禁止写入本配置。
weibo:
  enabled: false
  cookie_file: "${WEIBO_COOKIE_FILE}"
  search_url: "https://s.weibo.com/weibo"
  comments_url: "https://weibo.com/ajax/statuses/buildComments"
  target_posts: 20
  max_search_pages: 3
  timeout_seconds: 20
  request_interval_min_seconds: 4
  request_interval_max_seconds: 8
  trust_env_proxy: false
  comments:
    enabled: false
    max_posts: 2
    request_interval_min_seconds: 5
    request_interval_max_seconds: 10

selection:
  candidate_limit: 20
  read_limit: 8
  social_read_limit: 5
  max_per_source: 3
  relevance_model_min_score: 30
  content_filter_max_chars: 5000
