version: 1

# 暂时关闭官方检索支路；保留原有配置，之后可直接重新开启。
official:
  enabled: false

# NewsNow 提供各平台当前热榜；查询词会在本地匹配标题。
newsnow:
  enabled: true
  api_url: "https://newsnow.busiyi.world/api/s"
  timeout_seconds: 10

  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-hot"
      name: "财联社"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
      source_group: "news_media"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
      source_group: "news_media"

    - id: "tencent-hot"
      name: "腾讯新闻"
      expected_domain: "qq.com"
      source_group: "news_media"
      
    - id: "wallstreetcn-quick"
      name: "华尔街见闻快讯"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-telegraph"
      name: "财联社电报"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "jin10"
      name: "金十数据"
      expected_domain: "jin10.com"
      source_group: "news_media"

    - id: "gelonghui"
      name: "格隆汇"
      expected_domain: "gelonghui.com"
      source_group: "news_media"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
      source_group: "social_media"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
      source_group: "social_media"

    - id: "bilibili-hot-search"
      name: "B站热搜"
      expected_domain: "bilibili.com"
      source_group: "social_media"

# RSS 用于补充不一定进入热榜的最新媒体文章。
rss:
  enabled: true
  timeout_seconds: 15
  max_content_bytes: 6000000
  max_age_days: 30
  official_feeds:
    # 中国政府网路由依赖 RSSHub；通过环境变量 RSSHUB_BASE 指定实例。
    - id: "gov-policy"
      name: "中国政府网-政策文件"
      url: "${RSSHUB_BASE}/gov/cn/news/zhengce"
      layer: "fact"
      source_group: "official_source"
    - id: "gov-state-council"
      name: "中国政府网-国务院信息"
      url: "${RSSHUB_BASE}/gov/cn/news/gwy"
      layer: "fact"
      source_group: "official_source"
    - id: "gov-departments"
      name: "中国政府网-部门政务"
      url: "${RSSHUB_BASE}/gov/cn/news/bm"
      layer: "fact"
      source_group: "official_source"
    - id: "gov-policy-library"
      name: "国务院政策文件库"
      url: "${RSSHUB_BASE}/gov/zhengce/zhengceku/gwywj"
      layer: "fact"
      source_group: "official_source"
    # 国家统计局提供官方原生 RSS，不依赖 RSSHub。
    - id: "stats-latest"
      name: "国家统计局-最新发布"
      url: "https://www.stats.gov.cn/sj/zxfb/rss.xml"
      layer: "fact"
      source_group: "official_source"
    - id: "stats-analysis"
      name: "国家统计局-数据解读"
      url: "https://www.stats.gov.cn/sj/sjjd/rss.xml"
      layer: "fact"
      source_group: "official_source"
    # 人民银行路由先保留配置，逐个验证后再启用。
    - id: "pbc-open-market"
      name: "人民银行-公开市场业务公告"
      url: "${RSSHUB_BASE}/pbc/tradeAnnouncement"
      layer: "fact"
      source_group: "official_source"
      enabled: false
    - id: "pbc-news"
      name: "人民银行-沟通交流"
      url: "${RSSHUB_BASE}/pbc/goutongjiaoliu"
      layer: "fact"
      source_group: "official_source"
      enabled: false

  # media 层进入 MediaNode，来源属性由 source_group 表示。
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      layer: "media"
      source_group: "news_media"
    - id: "yahoo-finance"
      name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"
      layer: "media"
      source_group: "news_media"

    # RSSHub 社交平台路由，验证实例可用后再开启。
    - id: "xueqiu-hot"
      name: "雪球热门"
      url: "${RSSHUB_BASE}/xueqiu/hots"
      layer: "media"
      source_group: "social_media"
      enabled: false

selection:
  candidate_limit: 20
  read_limit: 8
  social_read_limit: 5
  max_per_source: 3
