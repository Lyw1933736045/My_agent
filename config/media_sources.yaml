version: 1

# 暂时关闭官方检索支路；保留原有配置，之后可直接重新开启。
official:
  enabled: false

# NewsNow 提供各平台当前热榜；查询词会在本地匹配标题。
newsnow:
  enabled: true
  api_url: "https://newsnow.busiyi.world/api/s"
  timeout_seconds: 10

  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-hot"
      name: "财联社"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
      source_group: "news_media"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
      source_group: "news_media"

    - id: "tencent-hot"
      name: "腾讯新闻"
      expected_domain: "qq.com"
      source_group: "news_media"
      
    - id: "wallstreetcn-quick"
      name: "华尔街见闻快讯"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-telegraph"
      name: "财联社电报"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "jin10"
      name: "金十数据"
      expected_domain: "jin10.com"
      source_group: "news_media"

    - id: "gelonghui"
      name: "格隆汇"
      expected_domain: "gelonghui.com"
      source_group: "news_media"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
      source_group: "social_media"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
      source_group: "social_media"

    - id: "bilibili-hot-search"
      name: "B站热搜"
      expected_domain: "bilibili.com"
      source_group: "social_media"

# RSS 用于补充不一定进入热榜的最新媒体文章。
rss:
  enabled: true
  timeout_seconds: 15
  max_content_bytes: 6000000
  max_age_days: 30
  # 暂无官方 RSS 来源。
  official_feeds: []

  feeds:
    # 财经与新闻媒体
    - id: "wallstreetcn-live"
      name: "华尔街见闻-实时快讯"
      url: "${RSSHUB_BASE}/wallstreetcn/live"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "wallstreetcn-hot"
      name: "华尔街见闻-热门文章"
      url: "${RSSHUB_BASE}/wallstreetcn/hot"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "wallstreetcn-news"
      name: "华尔街见闻-新闻"
      url: "${RSSHUB_BASE}/wallstreetcn/news"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "jin10"
      name: "金十数据"
      url: "${RSSHUB_BASE}/jin10"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "gelonghui-live"
      name: "格隆汇-实时快讯"
      url: "${RSSHUB_BASE}/gelonghui/live"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "gelonghui-home"
      name: "格隆汇-首页"
      url: "${RSSHUB_BASE}/gelonghui/home"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "gelonghui-hot"
      name: "格隆汇-热门文章"
      url: "${RSSHUB_BASE}/gelonghui/hot-article"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "cls-hot"
      name: "财联社-热门"
      url: "${RSSHUB_BASE}/cls/hot"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "cls-depth"
      name: "财联社-深度"
      url: "${RSSHUB_BASE}/cls/depth/1000"
      layer: "media"
      source_group: "news_media"
      enabled: true
    - id: "cls-telegraph"
      name: "财联社-电报"
      url: "${RSSHUB_BASE}/cls/telegraph"
      layer: "media"
      source_group: "news_media"
      enabled: true

    # 动态关键词路由，启用前需由程序替换查询参数。
    - id: "gelonghui-keyword"
      name: "格隆汇-关键词"
      url_template: "${RSSHUB_BASE}/gelonghui/keyword/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false
    - id: "eastmoney-search"
      name: "东方财富-关键词搜索"
      url_template: "${RSSHUB_BASE}/eastmoney/search/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false

    # 投资与社交平台
    - id: "xueqiu-hot"
      name: "雪球-热门内容"
      url: "${RSSHUB_BASE}/xueqiu/hots"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "xueqiu-today"
      name: "雪球-今日话题"
      url: "${RSSHUB_BASE}/xueqiu/today"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "weibo-hot"
      name: "微博-热搜"
      url: "${RSSHUB_BASE}/weibo/search/hot"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "weibo-keyword"
      name: "微博-关键词"
      url_template: "${RSSHUB_BASE}/weibo/keyword/{keyword}"
      layer: "media"
      source_group: "social_media"
      enabled: false
    - id: "zhihu-hot"
      name: "知乎-热榜"
      url: "${RSSHUB_BASE}/zhihu/hot"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "bilibili-hot-search"
      name: "B站-热搜"
      url: "${RSSHUB_BASE}/bilibili/hot-search"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "bilibili-popular"
      name: "B站-热门"
      url: "${RSSHUB_BASE}/bilibili/popular"
      layer: "media"
      source_group: "social_media"
      enabled: true
    - id: "bilibili-ranking"
      name: "B站-排行榜"
      url: "${RSSHUB_BASE}/bilibili/ranking/0/3/1"
      layer: "media"
      source_group: "social_media"
      enabled: true

selection:
  candidate_limit: 20
  read_limit: 8
  social_read_limit: 5
  max_per_source: 3
