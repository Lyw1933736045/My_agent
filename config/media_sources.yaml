version: 1

# 暂时关闭官方检索支路；保留原有配置，之后可直接重新开启。
official:
  enabled: false

# NewsNow 提供各平台当前热榜；查询词会在本地匹配标题。
newsnow:
  enabled: true
  api_url: "https://newsnow.busiyi.world/api/s"
  timeout_seconds: 10

  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-hot"
      name: "财联社"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
      source_group: "news_media"

    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
      source_group: "news_media"

    - id: "tencent-hot"
      name: "腾讯新闻"
      expected_domain: "qq.com"
      source_group: "news_media"
      
    - id: "wallstreetcn-quick"
      name: "华尔街见闻快讯"
      expected_domain: "wallstreetcn.com"
      source_group: "news_media"

    - id: "cls-telegraph"
      name: "财联社电报"
      expected_domain: "cls.cn"
      source_group: "news_media"

    - id: "jin10"
      name: "金十数据"
      expected_domain: "jin10.com"
      source_group: "news_media"

    - id: "gelonghui"
      name: "格隆汇"
      expected_domain: "gelonghui.com"
      source_group: "news_media"

    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
      source_group: "social_media"

    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
      source_group: "social_media"

    - id: "bilibili-hot-search"
      name: "B站热搜"
      expected_domain: "bilibili.com"
      source_group: "social_media"

# RSS 用于补充不一定进入热榜的最新媒体文章。
rss:
  enabled: true
  timeout_seconds: 15
  max_content_bytes: 6000000
  max_age_days: 30
  # 暂无官方政策文件 RSS；媒体侧权威源见下方 official_media。
  official_feeds: []

  feeds:
    # =========================
    # 官方及权威媒体
    # =========================
    - id: "cctv-xwlb"
      name: "央视新闻-新闻联播"
      url: "${RSSHUB_BASE}/cctv/xwlb"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "people-finance"
      name: "人民网-财经"
      url: "${RSSHUB_BASE}/people/finance"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "inewsweek-finance"
      name: "中国新闻周刊-经济"
      url: "${RSSHUB_BASE}/inewsweek/finance"
      layer: "media"
      source_group: "official_media"
      enabled: true

    - id: "chinanews-latest"
      name: "中国新闻网-最新"
      url: "${RSSHUB_BASE}/chinanews"
      layer: "media"
      source_group: "official_media"
      enabled: true

    # =========================
    # 内地财经媒体
    # =========================
    - id: "wallstreetcn-live"
      name: "华尔街见闻-实时快讯"
      url: "${RSSHUB_BASE}/wallstreetcn/live"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "wallstreetcn-hot"
      name: "华尔街见闻-热门文章"
      url: "${RSSHUB_BASE}/wallstreetcn/hot"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "wallstreetcn-news"
      name: "华尔街见闻-新闻"
      url: "${RSSHUB_BASE}/wallstreetcn/news"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-live"
      name: "格隆汇-实时快讯"
      url: "${RSSHUB_BASE}/gelonghui/live"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-home"
      name: "格隆汇-首页"
      url: "${RSSHUB_BASE}/gelonghui/home"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "gelonghui-hot"
      name: "格隆汇-热门文章"
      url: "${RSSHUB_BASE}/gelonghui/hot-article"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "yicai-latest"
      name: "第一财经-最新"
      url: "${RSSHUB_BASE}/yicai/latest"
      layer: "media"
      source_group: "news_media"
      enabled: true

    - id: "yicai-headline"
      name: "第一财经-头条"
      url: "${RSSHUB_BASE}/yicai/headline"
      layer: "media"
      source_group: "news_media"
      enabled: true

    # =========================
    # 社交平台
    # =========================
    - id: "zhihu-hot"
      name: "知乎-热榜"
      url: "${RSSHUB_BASE}/zhihu/hot"
      layer: "media"
      source_group: "social_media"
      enabled: true

    # =========================
    # 动态关键词路由（默认关闭）
    # =========================
    - id: "gelonghui-keyword"
      name: "格隆汇-关键词"
      url_template: "${RSSHUB_BASE}/gelonghui/keyword/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false

    - id: "eastmoney-search"
      name: "东方财富-关键词搜索"
      url_template: "${RSSHUB_BASE}/eastmoney/search/{keyword}"
      layer: "media"
      source_group: "news_media"
      enabled: false

# Tavily 与 NewsNow/RSS 并行，只用于发现 URL；简报仍重新抓取正文。
tavily:
  enabled: true
  max_results_per_query: 5
  search_depth: "basic"
  # days: 7

selection:
  candidate_limit: 20
  read_limit: 8
  social_read_limit: 5
  max_per_source: 3
