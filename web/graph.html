<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识图谱｜金融单一智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/workspace.css">
</head>
<body>
  <div class="workspace">
    <header class="workspace-header">
      <a class="btn-ghost" href="/">返回简报</a>
      <h1>知识图谱</h1>
      <span id="graph-meta" class="meta">来源：真实证据</span>
      <nav>
        <a id="to-simulation" class="btn-primary" href="/simulation">模拟推演</a>
      </nav>
    </header>
    <main class="split">
      <section class="graph-stage" id="graph-stage">
        <div class="graph-filters" role="tablist">
          <button type="button" class="is-active" data-filter="actors">可发声主体</button>
          <button type="button" data-filter="context">主体与关联知识</button>
          <button type="button" data-filter="all">完整知识图谱</button>
        </div>
        <svg id="graph-svg" role="img" aria-label="真实知识图谱"></svg>
        <div class="graph-legend">
          <span>大节点：可发声主体</span>
          <span>小节点：关联知识</span>
          <span>实线 = 真实证据</span>
        </div>
      </section>
      <aside class="side-panel">
        <div class="side-scroll">
          <div id="graph-message" class="message">正在载入真实图谱…</div>
          <div id="graph-detail"></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="/assets/graph-view.js"></script>
  <script src="/assets/graph.js"></script>
</body>
</html>
